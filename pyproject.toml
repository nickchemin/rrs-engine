[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rrs-engine"
version = "2.6.0"
description = "Algorithmic NHL Real Sports fantasy draft optimizer & projection engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Nick Chemin" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "numpy>=1.24.0",
    "requests>=2.28.0,<3.0.0",
    "tzdata>=2023.3; sys_platform == 'win32'",
    "scikit-learn>=1.2.0",
    "scipy>=1.10.0",
    "rapidfuzz>=3.0.0",
    "pillow>=8.0.0",
    "pytesseract>=0.3.10",
]

[project.scripts]
rrs = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = [
    "db",
    "image_parser",
    "main",
    "model",
    "nhl_api",
    "optimizer",
    "paths",
    "slate",
]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/test_engine.py" = ["E402"]
